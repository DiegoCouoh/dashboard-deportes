<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Deportivo Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --bg2: #0a101c;
      --card: #111827;
      --card2: #1a2332;
      --border: #1e293b;
      --accent: #6366f1;
      --accent2: #a855f7;
      --live: #f97316;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
      --yellow: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99,102,241,0.18), transparent),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(168,85,247,0.12), transparent);
    }

    /* HEADER */
    header {
      background: rgba(10,16,28,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(99,102,241,0.15);
      padding: 0.85rem 1.4rem;
      position: sticky;
      top: 0;
      z-index: 300;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .brand h1 span {
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--live);
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.25);
      padding: 0.28rem 0.7rem;
      border-radius: 999px;
    }
    .controls {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    select, input {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.48rem 0.85rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: inherit;
      transition: border 0.2s, box-shadow 0.2s;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    #searchInput { min-width: 190px; }
    .status {
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.6s infinite;
    }
    .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    main { max-width: 1400px; margin: 0 auto; padding: 1.2rem 1.2rem 3.5rem; }

    /* TABS */
    .tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1.3rem;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.45rem 1.05rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.86rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab:hover { background: var(--card2); border-color: #334155; }
    .tab.active {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 15px rgba(99,102,241,0.35);
    }

    /* SPORT GROUP */
    .sport-block { margin-bottom: 2rem; }
    .sport-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.9rem;
      padding-left: 0.2rem;
    }
    .sport-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .sport-header .count {
      font-size: 0.75rem;
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 1rem;
    }

    /* CARD */
    .card {
      background: linear-gradient(145deg, #111827, #0f172a);
      border: 1px solid rgba(99,102,241,0.12);
      border-radius: 16px;
      padding: 1.1rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      overflow: hidden;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(99,102,241,0.08), rgba(168,85,247,0.05));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .card:hover {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(99,102,241,0.4);
      box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,102,241,0.15);
    }
    .card:hover::after { opacity: 1; }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.85rem;
      font-size: 0.76rem;
      color: var(--muted);
      position: relative;
      z-index: 1;
    }
    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 7px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    .badge.live {
      background: linear-gradient(90deg, #f97316, #fb923c);
      color: #000;
      animation: pulse 1.2s infinite;
    }
    .badge.final { background: #1e293b; color: #94a3b8; }
    .badge.scheduled { background: rgba(99,102,241,0.2); color: #a5b4fc; }

    .teams { display: flex; flex-direction: column; gap: 0.6rem; position: relative; z-index: 1; }
    .team {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }
    .team img {
      width: 38px; height: 38px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
    }
    .team .name { flex: 1; font-weight: 600; font-size: 0.98rem; }
    .team .score {
      font-size: 1.45rem;
      font-weight: 800;
      min-width: 38px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .team .score.win { color: var(--green); text-shadow: 0 0 12px rgba(16,185,129,0.4); }

    .card-bottom {
      margin-top: 0.85rem;
      padding-top: 0.7rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }
    .card-bottom .cta { color: #818cf8; font-weight: 500; }

    /* EMPTY / LOADING */
    .empty {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--muted);
    }
    .empty .spinner {
      width: 42px; height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* MODAL */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; visibility: hidden;
      transition: all 0.25s;
    }
    .overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(160deg, #0f172a, #111827);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 20px;
      width: 100%; max-width: 700px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
      transform: translateY(12px) scale(0.97);
      transition: transform 0.25s;
    }
    .overlay.open .modal { transform: none; }
    .modal-x {
      position: absolute; top: 1rem; right: 1rem;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-x:hover { color: #fff; background: #1e293b; }
    .modal-head {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.3rem;
      padding-right: 2.2rem;
    }
    .modal-head img { width: 48px; height: 48px; object-fit: contain; }
    .modal-score { font-size: 1.8rem; font-weight: 800; margin: 0 0.3rem; }
    .modal-title { font-size: 1.15rem; font-weight: 700; }
    .modal-sub { font-size: 0.85rem; color: var(--muted); margin-top: 0.2rem; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
      margin-bottom: 1.2rem;
    }
    .stat {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.8rem;
    }
    .stat .lbl { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.25rem; }
    .stat .val { font-size: 1.1rem; font-weight: 700; }
    .section { margin-top: 1.2rem; }
    .section h3 {
      font-size: 0.9rem;
      color: #a5b4fc;
      margin-bottom: 0.6rem;
      font-weight: 600;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 0.9rem;
    }
    .tip {
      margin-top: 1.4rem;
      padding: 1rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.08));
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 12px;
      font-size: 0.88rem;
    }
    .tip strong { color: #a5b4fc; }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      #searchInput { min-width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>Dashboard <span>Pro</span></h1>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="controls">
      <select id="sport">
        <option value="all">🔥 Todos los deportes</option>
        <option value="soccer/eng.1">Premier League</option>
        <option value="soccer/esp.1">La Liga</option>
        <option value="soccer/mex.1">Liga MX</option>
        <option value="soccer/ita.1">Serie A</option>
        <option value="soccer/ger.1">Bundesliga</option>
        <option value="soccer/fra.1">Ligue 1</option>
        <option value="soccer/uefa.champions">Champions League</option>
        <option value="soccer/uefa.europa">Europa League</option>
        <option value="soccer/usa.1">MLS</option>
        <option value="basketball/nba">NBA</option>
        <option value="football/nfl">NFL</option>
        <option value="baseball/mlb">MLB</option>
        <option value="hockey/nhl">NHL</option>
      </select>
      <input type="text" id="search" placeholder="Buscar equipo o partido..." />
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Cargando...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-v="all">Todos</div>
      <div class="tab" data-v="live">En Vivo</div>
      <div class="tab" data-v="pre">Próximos</div>
      <div class="tab" data-v="post">Finalizados</div>
      <div class="tab" data-v="cal">Calendario</div>
    </div>
    <div id="app">
      <div class="empty"><div class="spinner"></div>Cargando partidos...</div>
    </div>
  </main>

  <footer>
    Datos en vivo · Actualización automática · Logos · Stats + H2H · Base para análisis de apuestas
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-x" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // ========== CORS PROXY (soluciona el bloqueo de ESPN desde GitHub Pages) ==========
    const PROXY = "https://corsproxy.io/?";

    const SPORTS = [
      { path: "soccer/eng.1", name: "Premier League", icon: "🏴󠁧󠁢󠁥󠁮󠁧󠁿" },
      { path: "soccer/esp.1", name: "La Liga", icon: "🇪🇸" },
      { path: "soccer/mex.1", name: "Liga MX", icon: "🇲🇽" },
      { path: "soccer/ita.1", name: "Serie A", icon: "🇮🇹" },
      { path: "soccer/ger.1", name: "Bundesliga", icon: "🇩🇪" },
      { path: "soccer/fra.1", name: "Ligue 1", icon: "🇫🇷" },
      { path: "soccer/uefa.champions", name: "Champions League", icon: "🏆" },
      { path: "soccer/uefa.europa", name: "Europa League", icon: "🥈" },
      { path: "soccer/usa.1", name: "MLS", icon: "🇺🇸" },
      { path: "basketball/nba", name: "NBA", icon: "🏀" },
      { path: "football/nfl", name: "NFL", icon: "🏈" },
      { path: "baseball/mlb", name: "MLB", icon: "⚾" },
      { path: "hockey/nhl", name: "NHL", icon: "🏒" }
    ];

    let events = [];
    let view = "all";
    let sport = "all";
    let q = "";
    let cache = [];

    // Clock
    setInterval(() => {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("es-MX", { hour12: false });
    }, 1000);

    // Tabs
    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        view = t.dataset.v;
        render();
      };
    });

    document.getElementById("sport").onchange = e => {
      sport = e.target.value;
      load();
    };
    document.getElementById("search").oninput = e => {
      q = e.target.value.trim().toLowerCase();
      render();
    };

    function dates() {
      const t = new Date();
      const a = new Date(t); a.setDate(a.getDate() - 4);
      const b = new Date(t); b.setDate(b.getDate() + 6);
      const f = d => d.toISOString().slice(0,10).replace(/-/g,"");
      return f(a) + "-" + f(b);
    }

    async function getJSON(url) {
      const full = PROXY + encodeURIComponent(url);
      const r = await fetch(full);
      if (!r.ok) throw new Error(r.status);
      return r.json();
    }

    async function load() {
      const st = document.getElementById("statusText");
      const dot = document.getElementById("dot");
      st.textContent = "Actualizando...";
      dot.classList.remove("err");

      try {
        if (sport === "all") {
          const results = await Promise.allSettled(
            SPORTS.map(async s => {
              const data = await getJSON(
                `https://site.api.espn.com/apis/site/v2/sports/${s.path}/scoreboard?dates=${dates()}`
              );
              return { s, list: data.events || [] };
            })
          );
          events = [];
          results.forEach(r => {
            if (r.status === "fulfilled") {
              r.value.list.forEach(ev => {
                events.push({
                  ev,
                  path: r.value.s.path,
                  name: r.value.s.name,
                  icon: r.value.s.icon
                });
              });
            }
          });
        } else {
          const s = SPORTS.find(x => x.path === sport) || { name: sport, icon: "⚽" };
          const data = await getJSON(
            `https://site.api.espn.com/apis/site/v2/sports/${sport}/scoreboard?dates=${dates()}`
          );
          events = (data.events || []).map(ev => ({
            ev, path: sport, name: s.name, icon: s.icon
          }));
        }

        events.sort((a, b) => new Date(a.ev.date) - new Date(b.ev.date));
        cache = [...events];
        st.textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX");
        render();
      } catch (e) {
        console.error(e);
        if (cache.length) {
          events = cache;
          st.textContent = "Datos en caché";
          dot.classList.add("err");
          render();
        } else {
          document.getElementById("app").innerHTML = `
            <div class="empty">
              <p style="font-size:1.1rem;margin-bottom:0.6rem">No se pudieron cargar los partidos</p>
              <p style="font-size:0.9rem">El proxy o la API están temporalmente saturados.<br>
              Se reintentará automáticamente en 45 segundos.</p>
            </div>`;
          st.textContent = "Error de conexión";
          dot.classList.add("err");
        }
      }
    }

    function filtered() {
      let list = [...events];
      if (view === "live") list = list.filter(x => x.ev.status?.type?.state === "in");
      if (view === "pre")  list = list.filter(x => x.ev.status?.type?.state === "pre");
      if (view === "post") list = list.filter(x => x.ev.status?.type?.state === "post");
      if (q) {
        list = list.filter(x => {
          const n = (x.ev.name || "").toLowerCase();
          const teams = (x.ev.competitions?.[0]?.competitors || [])
            .map(c => (c.team?.displayName || "").toLowerCase()).join(" ");
          return n.includes(q) || teams.includes(q) || x.name.toLowerCase().includes(q);
        });
      }
      return list;
    }

    function card(item) {
      const e = item.ev;
      const st = e.status?.type?.state || "pre";
      const txt = e.status?.type?.shortDetail || "";
      let bc = "scheduled", bl = txt;
      if (st === "in")  { bc = "live"; bl = "EN VIVO"; }
      if (st === "post"){ bc = "final"; bl = "FINAL"; }

      const comps = e.competitions?.[0]?.competitors || [];
      const home = comps.find(c => c.homeAway === "home") || comps[0] || {};
      const away = comps.find(c => c.homeAway === "away") || comps[1] || {};
      const hLogo = home.team?.logo || "";
      const aLogo = away.team?.logo || "";
      const hName = home.team?.displayName || "—";
      const aName = away.team?.displayName || "—";
      const hScore = home.score ?? "—";
      const aScore = away.score ?? "—";
      const date = e.date ? new Date(e.date).toLocaleString("es-MX", {
        weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      }) : "";
      const venue = e.competitions?.[0]?.venue?.fullName || item.name;

      return `
        <div class="card" onclick="openModal('${e.id}','${item.path}','${item.name}')">
          <div class="card-top">
            <span>${date}</span>
            <span class="badge ${bc}">${bl}</span>
          </div>
          <div class="teams">
            <div class="team">
              ${aLogo ? `<img src="${aLogo}" onerror="this.style.opacity=0.3">` : '<div style="width:38px;height:38px"></div>'}
              <span class="name">${aName}</span>
              <span class="score ${away.winner ? 'win' : ''}">${aScore}</span>
            </div>
            <div class="team">
              ${hLogo ? `<img src="${hLogo}" onerror="this.style.opacity=0.3">` : '<div style="width:38px;height:38px"></div>'}
              <span class="name">${hName}</span>
              <span class="score ${home.winner ? 'win' : ''}">${hScore}</span>
            </div>
          </div>
          <div class="card-bottom">
            <span>${venue}</span>
            <span class="cta">Stats + H2H →</span>
          </div>
        </div>`;
    }

    function render() {
      const list = filtered();
      const app = document.getElementById("app");

      if (view === "cal") {
        const upcoming = list.filter(x => x.ev.status?.type?.state !== "post");
        if (!upcoming.length) {
          app.innerHTML = `<div class="empty">No hay partidos próximos</div>`;
          return;
        }
        const groups = {};
        upcoming.forEach(item => {
          const key = new Date(item.ev.date).toLocaleDateString("es-MX", {
            weekday: "long", day: "numeric", month: "long"
          });
          if (!groups[key]) groups[key] = [];
          groups[key].push(item);
        });
        app.innerHTML = Object.entries(groups).map(([day, items]) => `
          <div class="sport-block">
            <div class="sport-header"><h2>${day}</h2></div>
            <div class="grid">${items.map(card).join("")}</div>
          </div>`).join("");
        return;
      }

      if (!list.length) {
        app.innerHTML = `<div class="empty">No hay partidos con este filtro.<br><small>Prueba “Todos los deportes” o cambia de pestaña.</small></div>`;
        return;
      }

      if (sport === "all") {
        const groups = {};
        list.forEach(item => {
          if (!groups[item.name]) groups[item.name] = { icon: item.icon, items: [] };
          groups[item.name].items.push(item);
        });
        app.innerHTML = Object.entries(groups).map(([name, g]) => `
          <div class="sport-block">
            <div class="sport-header">
              <h2>${g.icon} ${name}</h2>
              <span class="count">${g.items.length}</span>
            </div>
            <div class="grid">${g.items.map(card).join("")}</div>
          </div>`).join("");
      } else {
        app.innerHTML = `<div class="grid">${list.map(card).join("")}</div>`;
      }
    }

    async function openModal(id, path, league) {
      const overlay = document.getElementById("overlay");
      const body = document.getElementById("modalBody");
      overlay.classList.add("open");
      body.innerHTML = `<div class="empty"><div class="spinner"></div>Cargando estadísticas y H2H...</div>`;

      try {
        const data = await getJSON(
          `https://site.api.espn.com/apis/site/v2/sports/${path}/summary?event=${id}`
        );
        const header = data.header || {};
        const comps = header.competitions?.[0]?.competitors || [];
        const home = comps.find(c => c.homeAway === "home") || comps[0] || {};
        const away = comps.find(c => c.homeAway === "away") || comps[1] || {};
        const ht = home.team || {};
        const at = away.team || {};
        const hs = home.score ?? "—";
        const as = away.score ?? "—";
        const status = header.competitions?.[0]?.status?.type?.detail || "";

        let stats = "";
        if (data.boxscore?.teams) {
          const labels = new Set();
          data.boxscore.teams.forEach(t => (t.statistics||[]).forEach(s => labels.add(s.label||s.name)));
          stats = `<div class="stats">`;
          [...labels].slice(0,8).forEach(l => {
            const h = data.boxscore.teams.find(t => t.homeAway==="home")?.statistics?.find(s => (s.label||s.name)===l);
            const a = data.boxscore.teams.find(t => t.homeAway==="away")?.statistics?.find(s => (s.label||s.name)===l);
            stats += `<div class="stat"><div class="lbl">${l}</div><div class="val">${a?.displayValue||"—"} · ${h?.displayValue||"—"}</div></div>`;
          });
          stats += `</div>`;
        }

        let h2h = "";
        const series = data.seasonseries || header.competitions?.[0]?.series;
        if (series) {
          h2h = `<div class="section"><h3>Enfrentamientos directos / Serie</h3>`;
          if (Array.isArray(series)) {
            series.forEach(s => {
              h2h += `<div class="row"><span>${s.summary||s.description||"Serie"}</span><strong>${s.wins||""}</strong></div>`;
            });
          } else {
            h2h += `<div class="row"><span>${series.summary||series.description||"Serie de temporada"}</span><strong>${series.wins||series.shortSummary||""}</strong></div>`;
          }
          h2h += `</div>`;
        }

        let leaders = "";
        if (data.leaders?.length) {
          leaders = `<div class="section"><h3>Líderes</h3>`;
          data.leaders.slice(0,5).forEach(l => {
            const p = l.leaders?.[0];
            if (p) leaders += `<div class="row"><span>${l.displayName||l.name}: ${p.athlete?.displayName||"—"}</span><strong>${p.displayValue||""}</strong></div>`;
          });
          leaders += `</div>`;
        }

        let injuries = "";
        if (data.injuries?.length) {
          injuries = `<div class="section"><h3>Lesiones / Ausencias</h3>`;
          data.injuries.slice(0,8).forEach(i => {
            injuries += `<div class="row"><span>${i.athlete?.displayName||i.displayName||"Jugador"}</span><span style="color:var(--red)">${i.status||i.type||"Out"}</span></div>`;
          });
          injuries += `</div>`;
        }

        body.innerHTML = `
          <div class="modal-head">
            ${at.logo ? `<img src="${at.logo}">` : ""}
            <span class="modal-score">${as} - ${hs}</span>
            ${ht.logo ? `<img src="${ht.logo}">` : ""}
            <div>
              <div class="modal-title">${at.displayName||"Visitante"} vs ${ht.displayName||"Local"}</div>
              <div class="modal-sub">${league} · ${status}</div>
            </div>
          </div>
          ${stats}
          ${h2h}
          ${leaders}
          ${injuries}
          <div class="tip">
            <strong>💡 Base para apuestas</strong><br>
            Usa estadísticas, H2H y lesiones para tomar mejores decisiones. Esta página te da el contexto, no recomendaciones de apuesta.
          </div>
        `;
      } catch {
        body.innerHTML = `<div class="empty">No se pudieron cargar los detalles de este partido.</div>`;
      }
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("open");
    }
    document.getElementById("overlay").onclick = e => {
      if (e.target.id === "overlay") closeModal();
    };
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    // Start
    load();
    setInterval(load, 45000);
  </script>
</body>
</html>
