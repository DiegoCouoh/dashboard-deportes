<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Deportivo Pro</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05080f;
      --card: #0f172a;
      --card2: #1e293b;
      --border: #1e293b;
      --accent: #6366f1;
      --accent2: #a855f7;
      --live: #f97316;
      --green: #10b981;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -20%, rgba(99,102,241,0.2), transparent),
        radial-gradient(ellipse 60% 40% at 85% 110%, rgba(168,85,247,0.15), transparent);
    }
    header {
      background: rgba(15,23,42,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(99,102,241,0.15);
      padding: 0.9rem 1.4rem;
      position: sticky; top: 0; z-index: 100;
      display: flex; flex-wrap: wrap; gap: 0.8rem;
      align-items: center; justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 0.7rem; }
    .brand-icon {
      width: 38px; height: 38px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 11px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem;
    }
    .brand h1 { font-size: 1.3rem; font-weight: 800; }
    .brand h1 span {
      background: linear-gradient(90deg, #818cf8, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .clock {
      font-variant-numeric: tabular-nums;
      font-weight: 600; font-size: 0.92rem;
      color: var(--live);
      background: rgba(249,115,22,0.12);
      border: 1px solid rgba(249,115,22,0.3);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }
    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    select, input {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.5rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
    }
    #search { min-width: 200px; }
    .status {
      font-size: 0.8rem; color: var(--muted);
      display: flex; align-items: center; gap: 0.4rem;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 1.5s infinite;
    }
    .dot.err { background: var(--red); box-shadow: 0 0 8px var(--red); animation: none; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    main { max-width: 1400px; margin: 0 auto; padding: 1.3rem 1.2rem 3rem; }

    .tabs {
      display: flex; gap: 0.4rem; margin-bottom: 1.4rem; flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1.15rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .tab:hover { background: var(--card2); }
    .tab.active {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 18px rgba(99,102,241,0.4);
    }

    .sport-block { margin-bottom: 2.2rem; }
    .sport-header {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1rem; padding-left: 0.15rem;
    }
    .sport-header h2 { font-size: 1.2rem; font-weight: 700; }
    .sport-header .count {
      font-size: 0.75rem;
      background: rgba(99,102,241,0.18);
      color: #a5b4fc;
      padding: 0.18rem 0.6rem;
      border-radius: 6px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.1rem;
    }

    .card {
      background: linear-gradient(160deg, #0f172a, #111827);
      border: 1px solid rgba(99,102,241,0.12);
      border-radius: 16px;
      padding: 1.15rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
      position: relative;
      overflow: hidden;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(99,102,241,0.45);
      box-shadow: 0 18px 40px -12px rgba(0,0,0,0.65), 0 0 0 1px rgba(99,102,241,0.2);
    }
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 0.9rem; font-size: 0.78rem; color: var(--muted);
    }
    .badge {
      padding: 0.22rem 0.65rem;
      border-radius: 7px;
      font-size: 0.72rem;
      font-weight: 700;
    }
    .badge.live {
      background: linear-gradient(90deg, #f97316, #fb923c);
      color: #000;
      animation: pulse 1.2s infinite;
    }
    .badge.final { background: #1e293b; color: #94a3b8; }
    .badge.scheduled { background: rgba(99,102,241,0.22); color: #a5b4fc; }

    .teams { display: flex; flex-direction: column; gap: 0.65rem; }
    .team { display: flex; align-items: center; gap: 0.75rem; }
    .team img {
      width: 40px; height: 40px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255,255,255,0.04);
      flex-shrink: 0;
    }
    .team .name { flex: 1; font-weight: 600; font-size: 1rem; }
    .team .score {
      font-size: 1.5rem;
      font-weight: 800;
      min-width: 40px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .team .score.win { color: var(--green); text-shadow: 0 0 14px rgba(16,185,129,0.45); }

    .card-bottom {
      margin-top: 0.9rem;
      padding-top: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex; justify-content: space-between;
    }
    .card-bottom .cta { color: #818cf8; font-weight: 500; }

    .empty {
      text-align: center;
      padding: 4.5rem 1.5rem;
      color: var(--muted);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 1.1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      opacity: 0; visibility: hidden;
      transition: all 0.25s;
    }
    .overlay.open { opacity: 1; visibility: visible; }
    .modal {
      background: linear-gradient(165deg, #0f172a, #1e293b);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 20px;
      width: 100%; max-width: 520px;
      padding: 1.6rem;
      position: relative;
      transform: translateY(15px) scale(0.97);
      transition: transform 0.25s;
    }
    .overlay.open .modal { transform: none; }
    .modal-x {
      position: absolute; top: 1rem; right: 1rem;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-x:hover { color: #fff; }
    .modal-head {
      text-align: center;
      margin-bottom: 1.4rem;
    }
    .modal-logos {
      display: flex; align-items: center; justify-content: center; gap: 1rem;
      margin-bottom: 0.8rem;
    }
    .modal-logos img { width: 56px; height: 56px; object-fit: contain; }
    .modal-score { font-size: 2.2rem; font-weight: 800; }
    .modal-title { font-size: 1.15rem; font-weight: 700; margin-top: 0.4rem; }
    .modal-sub { font-size: 0.9rem; color: var(--muted); margin-top: 0.25rem; }
    .info-row {
      display: flex; justify-content: space-between;
      padding: 0.65rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 0.95rem;
    }
    .tip {
      margin-top: 1.4rem;
      padding: 1rem;
      background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(168,85,247,0.1));
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 12px;
      font-size: 0.9rem;
    }
    .tip strong { color: #a5b4fc; }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      #search { min-width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>Dashboard <span>Pro</span></h1>
      <div class="clock" id="clock">--:--:--</div>
    </div>
    <div class="controls">
      <select id="sport">
        <option value="all">🔥 Todos los deportes</option>
        <option value="football">Fútbol</option>
        <option value="basketball">Básquetbol</option>
        <option value="tennis">Tenis</option>
        <option value="hockey">Hockey</option>
        <option value="baseball">Béisbol</option>
        <option value="volleyball">Voleibol</option>
      </select>
      <input type="text" id="search" placeholder="Buscar equipo o partido..." />
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">Cargando...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-v="all">Todos</div>
      <div class="tab" data-v="live">En Vivo</div>
      <div class="tab" data-v="scheduled">Próximos</div>
      <div class="tab" data-v="finished">Finalizados</div>
    </div>
    <div id="app">
      <div class="empty"><div class="spinner"></div>Cargando partidos en vivo...</div>
    </div>
  </main>

  <footer>
    Datos en tiempo real · Actualización automática cada 40 s · Logos · Base para análisis de apuestas
  </footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <button class="modal-x" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    const SPORTS = [
      { id: "football", name: "Fútbol", icon: "⚽" },
      { id: "basketball", name: "Básquetbol", icon: "🏀" },
      { id: "tennis", name: "Tenis", icon: "🎾" },
      { id: "hockey", name: "Hockey", icon: "🏒" },
      { id: "baseball", name: "Béisbol", icon: "⚾" },
      { id: "volleyball", name: "Voleibol", icon: "🏐" }
    ];

    let matches = [];
    let view = "all";
    let sport = "all";
    let query = "";
    let cache = [];

    // Reloj
    setInterval(() => {
      document.getElementById("clock").textContent =
        new Date().toLocaleTimeString("es-MX", { hour12: false });
    }, 1000);

    // Tabs
    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        view = t.dataset.v;
        render();
      };
    });

    document.getElementById("sport").onchange = e => {
      sport = e.target.value;
      load();
    };
    document.getElementById("search").oninput = e => {
      query = e.target.value.trim().toLowerCase();
      render();
    };

    async function fetchSport(sportId) {
      const url = `https://sportscore.com/api/widget/matches/?sport=${sportId}&limit=40`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      return (data.matches || []).map(m => ({
        ...m,
        sportId,
        sportName: SPORTS.find(s => s.id === sportId)?.name || sportId,
        sportIcon: SPORTS.find(s => s.id === sportId)?.icon || "🏆"
      }));
    }

    async function load() {
      const st = document.getElementById("statusText");
      const dot = document.getElementById("dot");
      st.textContent = "Actualizando...";
      dot.classList.remove("err");

      try {
        if (sport === "all") {
          const results = await Promise.allSettled(
            SPORTS.map(s => fetchSport(s.id))
          );
          matches = [];
          results.forEach(r => {
            if (r.status === "fulfilled") matches.push(...r.value);
          });
        } else {
          matches = await fetchSport(sport);
        }

        // Ordenar por hora
        matches.sort((a, b) => new Date(a.time) - new Date(b.time));
        cache = [...matches];

        st.textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX");
        render();
      } catch (err) {
        console.error(err);
        if (cache.length) {
          matches = cache;
          st.textContent = "Datos en caché";
          dot.classList.add("err");
          render();
        } else {
          document.getElementById("app").innerHTML = `
            <div class="empty">
              <p style="font-size:1.15rem;margin-bottom:0.5rem">No se pudieron cargar los partidos</p>
              <p>Se reintentará automáticamente en unos segundos.</p>
            </div>`;
          st.textContent = "Error de conexión";
          dot.classList.add("err");
        }
      }
    }

    function filtered() {
      let list = [...matches];

      if (view === "live") {
        list = list.filter(m => m.status === "live" || m.status === "inprogress" || (m.status_text || "").toLowerCase().includes("live"));
      } else if (view === "scheduled") {
        list = list.filter(m => m.status === "notstarted" || m.status === "scheduled" || !m.home_score);
      } else if (view === "finished") {
        list = list.filter(m => m.status === "finished" || m.status === "closed" || (m.status_text || "").toLowerCase().includes("finished"));
      }

      if (query) {
        list = list.filter(m => {
          const text = `${m.home} ${m.away} ${m.competition} ${m.sportName}`.toLowerCase();
          return text.includes(query);
        });
      }
      return list;
    }

    function card(m) {
      let bc = "scheduled", bl = m.status_text || m.status || "Próximo";
      const st = (m.status || "").toLowerCase();
      const txt = (m.status_text || "").toLowerCase();

      if (st === "live" || st === "inprogress" || txt.includes("live")) {
        bc = "live"; bl = "EN VIVO";
      } else if (st === "finished" || st === "closed" || txt.includes("finished") || txt.includes("ended")) {
        bc = "final"; bl = "FINAL";
      }

      const date = m.time ? new Date(m.time).toLocaleString("es-MX", {
        weekday: "short", day: "numeric", month: "short",
        hour: "2-digit", minute: "2-digit"
      }) : "";

      const homeScore = m.home_score ?? "—";
      const awayScore = m.away_score ?? "—";

      return `
        <div class="card" onclick='openModal(${JSON.stringify(m).replace(/'/g, "&#39;")})'>
          <div class="card-top">
            <span>${date}</span>
            <span class="badge ${bc}">${bl}</span>
          </div>
          <div class="teams">
            <div class="team">
              ${m.away_logo ? `<img src="${m.away_logo}" onerror="this.style.opacity=0.3">` : '<div style="width:40px;height:40px"></div>'}
              <span class="name">${m.away || "—"}</span>
              <span class="score">${awayScore}</span>
            </div>
            <div class="team">
              ${m.home_logo ? `<img src="${m.home_logo}" onerror="this.style.opacity=0.3">` : '<div style="width:40px;height:40px"></div>'}
              <span class="name">${m.home || "—"}</span>
              <span class="score">${homeScore}</span>
            </div>
          </div>
          <div class="card-bottom">
            <span>${m.competition || m.sportName}</span>
            <span class="cta">Ver detalles →</span>
          </div>
        </div>`;
    }

    function render() {
      const list = filtered();
      const app = document.getElementById("app");

      if (!list.length) {
        app.innerHTML = `<div class="empty">No hay partidos con este filtro.<br><small>Prueba “Todos los deportes” o cambia de pestaña.</small></div>`;
        return;
      }

      if (sport === "all") {
        const groups = {};
        list.forEach(m => {
          const key = m.sportName;
          if (!groups[key]) groups[key] = { icon: m.sportIcon, items: [] };
          groups[key].items.push(m);
        });
        app.innerHTML = Object.entries(groups).map(([name, g]) => `
          <div class="sport-block">
            <div class="sport-header">
              <h2>${g.icon} ${name}</h2>
              <span class="count">${g.items.length} partidos</span>
            </div>
            <div class="grid">${g.items.map(card).join("")}</div>
          </div>
        `).join("");
      } else {
        app.innerHTML = `<div class="grid">${list.map(card).join("")}</div>`;
      }
    }

    function openModal(m) {
      const overlay = document.getElementById("overlay");
      const body = document.getElementById("modalBody");
      overlay.classList.add("open");

      const date = m.time ? new Date(m.time).toLocaleString("es-MX", {
        weekday: "long", day: "numeric", month: "long",
        hour: "2-digit", minute: "2-digit"
      }) : "";

      body.innerHTML = `
        <div class="modal-head">
          <div class="modal-logos">
            ${m.away_logo ? `<img src="${m.away_logo}">` : ""}
            <span class="modal-score">${m.away_score ?? "—"} - ${m.home_score ?? "—"}</span>
            ${m.home_logo ? `<img src="${m.home_logo}">` : ""}
          </div>
          <div class="modal-title">${m.away} vs ${m.home}</div>
          <div class="modal-sub">${m.competition || m.sportName}</div>
        </div>
        <div class="info-row"><span>Estado</span><strong>${m.status_text || m.status}</strong></div>
        <div class="info-row"><span>Fecha y hora</span><strong>${date}</strong></div>
        <div class="info-row"><span>Deporte</span><strong>${m.sportName}</strong></div>
        <div class="info-row"><span>Competición</span><strong>${m.competition || "—"}</strong></div>
        <div class="tip">
          <strong>💡 Base para apuestas</strong><br>
          Usa esta información como punto de partida. Combínala con forma reciente, lesiones y cuotas de casas de apuestas para tomar mejores decisiones.
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("overlay").classList.remove("open");
    }
    document.getElementById("overlay").onclick = e => {
      if (e.target.id === "overlay") closeModal();
    };
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") closeModal();
    });

    // Iniciar
    load();
    setInterval(load, 40000);
  </script>
</body>
</html>
