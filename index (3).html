<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Deportivo Pro · En Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b14;
      --bg2: #0d1321;
      --card: #151c2c;
      --card-hover: #1c2538;
      --border: #243044;
      --accent: #3b82f6;
      --accent2: #8b5cf6;
      --live: #f97316;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image: 
        radial-gradient(ellipse at 20% 0%, rgba(59,130,246,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(139,92,246,0.10) 0%, transparent 50%);
    }
    header {
      background: rgba(13,19,33,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.9rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-area h1 {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(135deg, #60a5fa, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .live-clock {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--live);
      background: rgba(249,115,22,0.12);
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      border: 1px solid rgba(249,115,22,0.3);
    }
    .controls {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      align-items: center;
    }
    select, input, button {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-family: inherit;
      transition: all 0.2s;
    }
    select:focus, input:focus, button:hover {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    button {
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.1); }
    #searchInput {
      min-width: 200px;
      background: var(--bg2);
    }
    .status-badge {
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 3rem;
    }
    .tabs {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .tab {
      padding: 0.5rem 1.1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab:hover { background: var(--card-hover); }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      color: white;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.1rem;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(59,130,246,0.05), rgba(139,92,246,0.05));
      opacity: 0;
      transition: opacity 0.25s;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: #3b82f680;
      box-shadow: 0 12px 30px -10px rgba(0,0,0,0.5);
    }
    .card:hover::before { opacity: 1; }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.9rem;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge.live { background: var(--live); color: #000; animation: pulse 1.2s infinite; }
    .badge.final { background: #334155; color: #cbd5e1; }
    .badge.scheduled { background: #1e3a8a; color: #93c5fd; }
    .teams-row {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .team-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .team-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }
    .team-name {
      flex: 1;
      font-weight: 600;
      font-size: 0.98rem;
    }
    .score {
      font-size: 1.4rem;
      font-weight: 800;
      min-width: 36px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .score.winner { color: var(--green); }
    .card-footer {
      margin-top: 0.85rem;
      padding-top: 0.7rem;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--muted);
      font-size: 1.05rem;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s;
    }
    .modal-overlay.open {
      opacity: 1;
      visibility: visible;
    }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.5rem;
      position: relative;
      transform: scale(0.95);
      transition: transform 0.25s;
    }
    .modal-overlay.open .modal { transform: scale(1); }
    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      width: 36px; height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
      color: var(--muted);
    }
    .modal-close:hover { color: white; background: #334155; }
    .modal-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-right: 2.5rem;
    }
    .modal-logos {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .modal-logos img {
      width: 48px; height: 48px;
      object-fit: contain;
    }
    .modal-score {
      font-size: 1.8rem;
      font-weight: 800;
      margin: 0 0.5rem;
    }
    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .modal-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      margin-top: 1rem;
    }
    .stat-box {
      background: var(--card);
      border-radius: 12px;
      padding: 0.85rem;
      border: 1px solid var(--border);
    }
    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .leaders {
      margin-top: 1.25rem;
    }
    .leaders h3 {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      color: var(--muted);
    }
    .leader-item {
      display: flex;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .calendar-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .calendar-day {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
    }
    .calendar-day-title {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    .teams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.9rem;
    }
    .team-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1rem;
      text-align: center;
      transition: all 0.2s;
    }
    .team-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .team-card img {
      width: 56px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }
    .team-card .name {
      font-weight: 600;
      font-size: 0.88rem;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    footer a { color: var(--accent); }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      #searchInput { min-width: 140px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo-area">
      <h1>⚽ Dashboard Pro</h1>
      <div class="live-clock" id="liveClock">--:--:--</div>
    </div>
    <div class="controls">
      <select id="sportSelect">
        <option value="soccer/eng.1">Premier League</option>
        <option value="soccer/esp.1">La Liga</option>
        <option value="soccer/mex.1">Liga MX</option>
        <option value="soccer/ita.1">Serie A</option>
        <option value="soccer/ger.1">Bundesliga</option>
        <option value="soccer/fra.1">Ligue 1</option>
        <option value="soccer/uefa.champions">Champions League</option>
        <option value="soccer/uefa.europa">Europa League</option>
        <option value="basketball/nba">NBA</option>
        <option value="football/nfl">NFL</option>
        <option value="baseball/mlb">MLB</option>
        <option value="hockey/nhl">NHL</option>
        <option value="soccer/usa.1">MLS</option>
      </select>
      <input type="text" id="searchInput" placeholder="Buscar equipo o partido..." />
      <div class="status-badge">
        <span class="dot"></span>
        <span id="lastUpdate">Cargando...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="tabs">
      <div class="tab active" data-view="all">Todos</div>
      <div class="tab" data-view="live">En Vivo</div>
      <div class="tab" data-view="scheduled">Próximos</div>
      <div class="tab" data-view="final">Finalizados</div>
      <div class="tab" data-view="calendar">Calendario</div>
      <div class="tab" data-view="teams">Equipos</div>
    </div>

    <div id="content" class="grid">
      <div class="empty">
        <div class="spinner"></div>
        Cargando partidos...
      </div>
    </div>
  </main>

  <footer>
    Datos en tiempo real · ESPN API pública · Actualización automática cada 40 segundos<br>
    Reloj en vivo · Logos · Estadísticas al hacer clic · Buscador · Interfaz propia
  </footer>

  <div class="modal-overlay" id="modal">
    <div class="modal" id="modalContent">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody">Cargando detalles...</div>
    </div>
  </div>

  <script>
    let currentData = [];
    let currentTeams = [];
    let currentView = "all";
    let currentSportPath = "soccer/eng.1";
    let searchQuery = "";
    let refreshTimer = null;

    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString("es-MX", { hour12: false });
      document.getElementById("liveClock").textContent = time;
    }
    updateClock();
    setInterval(updateClock, 1000);

    const sportSelect = document.getElementById("sportSelect");
    const searchInput = document.getElementById("searchInput");
    const content = document.getElementById("content");
    const lastUpdate = document.getElementById("lastUpdate");
    const modal = document.getElementById("modal");
    const modalBody = document.getElementById("modalBody");

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentView = tab.dataset.view;
        render();
      });
    });

    sportSelect.addEventListener("change", () => {
      currentSportPath = sportSelect.value;
      loadData();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      render();
    });

    async function loadData() {
      lastUpdate.textContent = "Actualizando...";
      try {
        const [scoreboardRes, teamsRes] = await Promise.all([
          fetch(`https://site.api.espn.com/apis/site/v2/sports/${currentSportPath}/scoreboard`),
          fetch(`https://site.api.espn.com/apis/site/v2/sports/${currentSportPath}/teams`)
        ]);

        const scoreboard = await scoreboardRes.json();
        currentData = scoreboard.events || [];

        try {
          const teamsData = await teamsRes.json();
          currentTeams = teamsData.sports?.[0]?.leagues?.[0]?.teams?.map(t => t.team) || [];
        } catch {
          currentTeams = [];
        }

        lastUpdate.textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX");
        render();
      } catch (err) {
        content.innerHTML = `<div class="empty">Error al cargar datos.<br>Intenta cambiar de deporte o recarga.</div>`;
        lastUpdate.textContent = "Error de conexión";
      }
    }

    function getFilteredEvents() {
      let events = [...currentData];

      if (currentView === "live") {
        events = events.filter(e => e.status?.type?.state === "in");
      } else if (currentView === "scheduled") {
        events = events.filter(e => e.status?.type?.state === "pre");
      } else if (currentView === "final") {
        events = events.filter(e => e.status?.type?.state === "post");
      }

      if (searchQuery) {
        events = events.filter(e => {
          const name = (e.name || "").toLowerCase();
          const short = (e.shortName || "").toLowerCase();
          const teams = (e.competitions?.[0]?.competitors || [])
            .map(c => (c.team?.displayName || c.athlete?.displayName || "").toLowerCase())
            .join(" ");
          return name.includes(searchQuery) || short.includes(searchQuery) || teams.includes(searchQuery);
        });
      }

      events.sort((a, b) => new Date(a.date) - new Date(b.date));
      return events;
    }

    function render() {
      if (currentView === "teams") {
        renderTeams();
        return;
      }
      if (currentView === "calendar") {
        renderCalendar();
        return;
      }

      const events = getFilteredEvents();
      if (events.length === 0) {
        content.className = "grid";
        content.innerHTML = `<div class="empty">No hay partidos que coincidan con tu búsqueda o filtro.</div>`;
        return;
      }

      content.className = "grid";
      content.innerHTML = events.map(event => createMatchCard(event)).join("");
    }

    function createMatchCard(event) {
      const status = event.status?.type?.state || "pre";
      const statusText = event.status?.type?.shortDetail || event.status?.type?.description || "";
      let badgeClass = "scheduled";
      let badgeLabel = statusText;
      if (status === "in") { badgeClass = "live"; badgeLabel = "EN VIVO"; }
      if (status === "post") { badgeClass = "final"; badgeLabel = "FINAL"; }

      const comps = event.competitions?.[0]?.competitors || [];
      const home = comps.find(c => c.homeAway === "home") || comps[0] || {};
      const away = comps.find(c => c.homeAway === "away") || comps[1] || {};

      const homeLogo = home.team?.logo || "";
      const awayLogo = away.team?.logo || "";
      const homeName = home.team?.displayName || home.athlete?.displayName || "—";
      const awayName = away.team?.displayName || away.athlete?.displayName || "—";
      const homeScore = home.score ?? "—";
      const awayScore = away.score ?? "—";
      const homeWinner = home.winner;
      const awayWinner = away.winner;

      const venue = event.competitions?.[0]?.venue?.fullName || "";
      const dateStr = event.date ? new Date(event.date).toLocaleString("es-MX", {
        weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
      }) : "";

      return `
        <div class="card" onclick="openMatch('${event.id}', '${currentSportPath}')">
          <div class="card-top">
            <span>${dateStr}</span>
            <span class="badge ${badgeClass}">${badgeLabel}</span>
          </div>
          <div class="teams-row">
            <div class="team-row">
              ${awayLogo ? `<img class="team-logo" src="${awayLogo}" alt="" onerror="this.style.display='none'">` : '<div class="team-logo"></div>'}
              <span class="team-name">${awayName}</span>
              <span class="score ${awayWinner ? 'winner' : ''}">${awayScore}</span>
            </div>
            <div class="team-row">
              ${homeLogo ? `<img class="team-logo" src="${homeLogo}" alt="" onerror="this.style.display='none'">` : '<div class="team-logo"></div>'}
              <span class="team-name">${homeName}</span>
              <span class="score ${homeWinner ? 'winner' : ''}">${homeScore}</span>
            </div>
          </div>
          <div class="card-footer">
            <span>${venue || event.name || ""}</span>
            <span>Clic para detalles →</span>
          </div>
        </div>
      `;
    }

    function renderCalendar() {
      const events = getFilteredEvents().filter(e => e.status?.type?.state !== "post");
      if (events.length === 0) {
        content.className = "grid";
        content.innerHTML = `<div class="empty">No hay partidos próximos en el calendario.</div>`;
        return;
      }

      const groups = {};
      events.forEach(e => {
        const d = new Date(e.date);
        const key = d.toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
        if (!groups[key]) groups[key] = [];
        groups[key].push(e);
      });

      content.className = "calendar-list";
      content.innerHTML = Object.entries(groups).map(([day, list]) => `
        <div class="calendar-day">
          <div class="calendar-day-title">${day}</div>
          <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));">
            ${list.map(e => createMatchCard(e)).join("")}
          </div>
        </div>
      `).join("");
    }

    function renderTeams() {
      let teams = currentTeams;
      if (searchQuery) {
        teams = teams.filter(t => 
          (t.displayName || "").toLowerCase().includes(searchQuery) ||
          (t.abbreviation || "").toLowerCase().includes(searchQuery)
        );
      }

      if (teams.length === 0) {
        content.className = "grid";
        content.innerHTML = `<div class="empty">No se encontraron equipos o este deporte no tiene listado disponible.</div>`;
        return;
      }

      content.className = "teams-grid";
      content.innerHTML = teams.map(t => `
        <div class="team-card">
          ${t.logo ? `<img src="${t.logo}" alt="${t.displayName}" onerror="this.style.display='none'">` : ""}
          <div class="name">${t.displayName || t.name}</div>
          <div style="font-size:0.75rem;color:var(--muted);margin-top:0.25rem;">${t.abbreviation || ""}</div>
        </div>
      `).join("");
    }

    async function openMatch(eventId, sportPath) {
      modal.classList.add("open");
      modalBody.innerHTML = `<div class="empty"><div class="spinner"></div>Cargando estadísticas del partido...</div>`;

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${sportPath}/summary?event=${eventId}`);
        const data = await res.json();

        const header = data.header || {};
        const comps = header.competitions?.[0]?.competitors || data.boxscore?.teams || [];
        const home = comps.find(c => c.homeAway === "home") || comps[0] || {};
        const away = comps.find(c => c.homeAway === "away") || comps[1] || {};

        const homeTeam = home.team || home;
        const awayTeam = away.team || away;
        const homeScore = home.score ?? "—";
        const awayScore = away.score ?? "—";

        let statsHtml = "";
        if (data.boxscore?.teams) {
          const teamStats = data.boxscore.teams;
          statsHtml = `<div class="stats-grid">`;
          const labels = new Set();
          teamStats.forEach(t => (t.statistics || []).forEach(s => labels.add(s.label || s.name)));
          [...labels].slice(0, 8).forEach(label => {
            const homeStat = teamStats.find(t => (t.homeAway === "home" || t.team?.id === homeTeam.id))?.statistics?.find(s => (s.label || s.name) === label);
            const awayStat = teamStats.find(t => (t.homeAway === "away" || t.team?.id === awayTeam.id))?.statistics?.find(s => (s.label || s.name) === label);
            statsHtml += `
              <div class="stat-box">
                <div class="stat-label">${label}</div>
                <div class="stat-value">${awayStat?.displayValue || "—"}  ·  ${homeStat?.displayValue || "—"}</div>
              </div>
            `;
          });
          statsHtml += `</div>`;
        }

        let leadersHtml = "";
        if (data.leaders && data.leaders.length) {
          leadersHtml = `<div class="leaders"><h3>Líderes del partido</h3>`;
          data.leaders.slice(0, 6).forEach(l => {
            const leader = l.leaders?.[0];
            if (leader) {
              leadersHtml += `<div class="leader-item">
                <span>${l.displayName || l.name}: ${leader.athlete?.displayName || "—"}</span>
                <strong>${leader.displayValue || ""}</strong>
              </div>`;
            }
          });
          leadersHtml += `</div>`;
        }

        let injuriesHtml = "";
        if (data.injuries && data.injuries.length) {
          injuriesHtml = `<div class="leaders"><h3>Lesiones reportadas</h3>`;
          data.injuries.slice(0, 8).forEach(inj => {
            injuriesHtml += `<div class="leader-item">
              <span>${inj.athlete?.displayName || inj.displayName || "Jugador"}</span>
              <span style="color:var(--red)">${inj.status || inj.type || "Lesionado"}</span>
            </div>`;
          });
          injuriesHtml += `</div>`;
        }

        const statusText = header.competitions?.[0]?.status?.type?.detail || header.status?.type?.detail || "";

        modalBody.innerHTML = `
          <div class="modal-header">
            <div class="modal-logos">
              ${awayTeam.logo ? `<img src="${awayTeam.logo}" alt="">` : ""}
              <span class="modal-score">${awayScore} - ${homeScore}</span>
              ${homeTeam.logo ? `<img src="${homeTeam.logo}" alt="">` : ""}
            </div>
            <div>
              <div class="modal-title">${awayTeam.displayName || awayTeam.name || "Visitante"} vs ${homeTeam.displayName || homeTeam.name || "Local"}</div>
              <div class="modal-meta">${statusText}</div>
            </div>
          </div>
          ${statsHtml}
          ${leadersHtml}
          ${injuriesHtml}
          ${!statsHtml && !leadersHtml ? '<p style="color:var(--muted);margin-top:1rem;">Estadísticas detalladas no disponibles para este partido en este momento.</p>' : ''}
        `;
      } catch (err) {
        modalBody.innerHTML = `<div class="empty">No se pudieron cargar las estadísticas de este partido.<br>Intenta de nuevo más tarde.</div>`;
      }
    }

    function closeModal() {
      modal.classList.remove("open");
    }

    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    loadData();
    refreshTimer = setInterval(loadData, 40000);
  </script>
</body>
</html>
